<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Family Drive</title>
    <meta name="description" content="Our family's private drive for photos, videos and documents." />
    <meta property="og:title" content="Family Drive" />
    <meta property="og:description" content="Our family's private drive for photos, videos and documents." />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Paint in the user's last theme before the app loads (the saved account setting is applied once /api/me answers).
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
